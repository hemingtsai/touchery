[package]
name = "touchery"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
gpui-component = "0.5.1"
global-hotkey = "0.8"
pinyin = "0.10"
objc = "0.2"
anyhow = "1"
tray-icon = "0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dirs = "6"
mlua = { version = "0.12.0", features = ["luajit", "vendored", "send"] }
image = "0.25"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
