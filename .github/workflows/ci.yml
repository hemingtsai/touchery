name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: build and test
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build and test
        # `runtime_shaders` compiles GPUI's shaders at run time rather than at
        # build time, so the job does not depend on a full Metal toolchain; the
        # released DMG is still built from the default feature set.
        # `--locked` fails the job when Cargo.lock drifts from the manifests
        # instead of quietly resolving a different dependency set.
        run: cargo test --locked --features gpui/runtime_shaders -- --test-threads=1
